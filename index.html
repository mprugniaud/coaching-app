<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b" id="couleur-barre">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <title>Ma séance</title>
  <script>
    // Thème appliqué avant l'affichage, pour éviter un flash de l'autre couleur.
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch (e) {}
    function couleurBarre() {
      var t = document.documentElement.dataset.theme;
      var clair = t === "light" || (t === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
      document.getElementById("couleur-barre").content = clair ? "#fafafa" : "#09090b";
    }
    couleurBarre();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>
  <div id="repos" hidden></div>
  <div id="toast" hidden></div>
  <script src="db.js"></script>
  <script src="sync.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
